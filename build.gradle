plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.1'
    id 'io.spring.dependency-management' version '1.1.0'
}

group = 'com.opentext.appsec.demo'
version = '1.0.0-SNAPSHOT'
sourceCompatibility = '17'

defaultTasks 'build'

repositories {
    mavenCentral()
}

// The SPA is NOT built by default: backend-only workflows (build, test, bootRun) must not pay the
// npm cost. Opt in with -PwithFrontend when you need the SPA embedded in the jar.
// -PskipFrontend remains supported as an explicit override for callers that still pass it.
def frontendEnabled = project.hasProperty('withFrontend') && !project.hasProperty('skipFrontend')

// Use `npm.cmd` on Windows so Gradle can start the process correctly
def npmCmd = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

// `npm ci` gives reproducible installs on CI; `npm install` is far faster for day-to-day local work
def isCi = System.getenv('CI') != null || System.getenv('TF_BUILD') != null || System.getenv('GITHUB_ACTIONS') != null

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Spring Boot Actuator (INSECURE: exposing all actuator endpoints configured in properties)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // OpenAPI / Swagger UI for documenting the REST API
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'
    // springdoc core is provided by the starter; remove explicit core dependency
    // Spring Security and JWT (INSECURE demo usage)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose:6.2.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Ensure tests use JUnit Platform
test {
    useJUnitPlatform()
}

// Frontend build/copy tasks for embedded SPA (React + Vite)
if (frontendEnabled) {
    def frontendDir = file("${projectDir}/frontend")

    tasks.register('npmInstall', Exec) {
        description = 'Installs frontend npm dependencies'
        workingDir frontendDir
        commandLine npmCmd, isCi ? 'ci' : 'install'

        inputs.file("${frontendDir}/package.json")
        inputs.file("${frontendDir}/package-lock.json")
        // npm rewrites this marker on every successful install, so it is a cheap up-to-date signal
        outputs.file("${frontendDir}/node_modules/.package-lock.json")
    }

    tasks.register('buildFrontend', Exec) {
        description = 'Builds the React/Vite SPA into frontend/dist'
        dependsOn 'npmInstall'
        workingDir frontendDir
        commandLine npmCmd, 'run', 'build'

        inputs.dir("${frontendDir}/src")
        inputs.dir("${frontendDir}/public")
        inputs.file("${frontendDir}/index.html")
        inputs.file("${frontendDir}/package.json")
        inputs.file("${frontendDir}/package-lock.json")
        inputs.file("${frontendDir}/vite.config.js")
        inputs.file("${frontendDir}/tailwind.config.cjs")
        inputs.file("${frontendDir}/postcss.config.cjs")
        outputs.dir("${frontendDir}/dist")
        outputs.cacheIf { true }
    }

    // Stage into build/ (not src/) so generated assets never pollute the source tree
    def copyFrontend = tasks.register('copyFrontend', Copy) {
        dependsOn 'buildFrontend'
        from frontendDir.toPath().resolve('dist').toFile()
        into layout.buildDirectory.dir('frontend-resources/static')
    }

    // Passing the task provider lets Gradle wire the task dependency for processResources automatically
    sourceSets.main.resources.srcDir(copyFrontend.map { layout.buildDirectory.dir('frontend-resources').get() })
} else {
    logger.lifecycle('Frontend build skipped. Pass -PwithFrontend to embed the SPA in the jar.')
}
