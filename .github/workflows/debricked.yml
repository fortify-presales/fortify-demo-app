# Create GitHub Action Secrets for your version of the application:
# - DEBRICKED_ACCESS_TOKEN: API token for Debricked (https://debricked.com/)
name: Fortify SCA Scan

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

# Global environment variables
env:
  JAVA_VERSION: "17"
  BASE_DIR: "."

jobs:
  Fortify-SCA-Scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties','**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew || true
      # Install Debricked CLI using Fortify GitHub Action
      - name: Setup Fortify tools
        uses: fortify/github-action/setup@v3
        with:
          export-path: true
          debricked-cli: latest
      # Run Fortify SCA scan    
      - name: Run Fortify SCA scan
        # Normally you would comment the following out - this is for demo
        continue-on-error: true
        shell: bash
        run: |
            debricked fingerprint
            debricked scan --prefer-npm -t "${DEBRICKED_TOKEN}" -e "*/**.lock" -e "**/build/classes/test/**" -e "**/target/classes/test-classes/**" .
        env:
          DEBRICKED_TOKEN: ${{ secrets.DEBRICKED_ACCESS_TOKEN }}
      # Optionally import results into Fortify on Demand (FoD) for correlation with SAST results
